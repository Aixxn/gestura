services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongodb_data:/data/db

  apigateway:
    build:
      context: ./apiGateway
      dockerfile: Dockerfile
    image: gestura-apigateway:local
    ports: 
      - "8080:8080"
      - "9898:9898"
    restart: always
    depends_on:
      - mongodb
      - translationService
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - TRANSLATION_SERVICE_URL=http://translationService:8000
      - WEB_SOCKET_HOST=0.0.0.0
      - WEB_SOCKET_PORT=9898
      - JWT_SECRET=gestura-dev-jwt-secret-change-in-production
      - JWT_EXPIRES_IN=7d

  translationService:
    build:
      context: ./translationService
      dockerfile: Dockerfile
    image: gestura-translationservice:local
    ports:
      - "7860:8000"
    restart: always

volumes:
  mongodb_data:
